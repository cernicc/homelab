# LibreChat configuration, mounted read-only at /app/librechat.yaml.
# Reference: https://www.librechat.ai/docs/configuration/librechat_yaml
# Secrets never go here; reference env vars set in docker-compose.yml instead.

# Config schema version shipped with LibreChat v0.8.8. Bump together with the
# image (see librechat.example.yaml at the new tag).
version: 1.3.17

cache: true

interface:
  # MCP servers are declared below, not added in the UI.
  mcpServers:
    use: true
    create: false
    share: false
    public: false

registration:
  socialLogins: []

endpoints:
  custom:
    # OpenCode Go (subscription): https://opencode.ai/docs/go
    # Through agentgateway (see agentgateway/config.yaml), which adds the OpenCode
    # key and decides which models are offered.
    - name: OpenCode Go
      apiKey: "${AGENTGATEWAY_LIBRECHAT_API_KEY}"
      baseURL: http://agentgateway:4000/v1
      # Go rejects requests without a stable per-conversation session ID
      # (400 MissingSessionID) and asks clients for their own user agent.
      # The conversation ID placeholder resolves to "" when the request body
      # has none (e.g. a new chat's first message), and an empty header is
      # rejected too, so the user ID keeps the value non-empty.
      headers:
        x-opencode-session: "{{LIBRECHAT_USER_ID}}-{{LIBRECHAT_BODY_CONVERSATIONID}}"
        User-Agent: librechat/0.8.8
      models:
        # Fallback only; the live list comes from agentgateway's /models.
        default: ["glm-5.3"]
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: OpenCode Go

# New chats start on this spec, which turns the Memory MCP server on. A spec
# fixes the model; the full OpenCode Go model list stays in the selector
# (addedEndpoints), but chats started from it have Memory off until it's
# turned on under MCP Servers.
modelSpecs:
  addedEndpoints:
    - "OpenCode Go"
  list:
    - name: opencode-memory
      label: GLM 5.3 + Memory
      description: OpenCode Go glm-5.3 with understory memory turned on
      # Every new chat starts here, whatever was picked last.
      default: true
      preset:
        endpoint: "OpenCode Go"
        model: glm-5.3
      mcpServers:
        - understory

# LibreChat blocks MCP URLs on private addresses (SSRF protection); allow
# only agentgateway's port. Hostname entries trust whatever it resolves to.
mcpSettings:
  allowedAddresses:
    - "agentgateway:4000"

# MCP servers available to every user. All of them go through agentgateway's
# /mcp (see agentgateway/config.yaml), which adds each server's own credentials.
# Users turn them on per chat under MCP Servers in the composer.
mcpServers:
  understory:
    title: Memory
    description: Long-term memory in plain markdown (understory)
    type: streamable-http
    url: http://agentgateway:4000/mcp
    headers:
      Authorization: "Bearer ${AGENTGATEWAY_LIBRECHAT_API_KEY}"
    requiresOAuth: false
    # Each memory tool call runs understory's own agent, which takes a while.
    timeout: 300000
    # understory sends an overview of the memory as server instructions.
    serverInstructions: true
