name: ai

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  hermes:
    build: .
    restart: unless-stopped
    # Playwright/Chromium needs more than the default 64m /dev/shm.
    shm_size: 1gb
    environment:
      TZ: Europe/Ljubljana
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:?OPENCODE_GO_API_KEY must be set in .env}
      # Optional: any model id from https://opencode.ai/zen/go/v1/models (default: glm-5.3)
      AI_MODEL: ${AI_MODEL:-}
      # OpenAI-compatible gateway API, internal-only (not Traefik-routed) -- hermes-webui's
      # Tasks/cron health check talks to this over the docker network.
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${API_SERVER_KEY:?API_SERVER_KEY must be set in .env (any string, 16+ chars)}
    volumes:
      - hermes-data:/opt/data
      # hermes-webui needs a copy of the agent's installed source+deps to build a
      # matching Python environment for itself (its own docs call this "hermes-agent-src").
      # Populated automatically from this image's /opt/hermes on first `up` -- see the
      # note on the volume definition below about what happens if the image ever changes.
      - hermes-src:/opt/hermes
    networks:
      - proxy
    logging: *logging

  # Third-party web UI for the Hermes Agent running in the `hermes` service above
  # (https://github.com/nesquena/hermes-webui) -- replaces Hermes' own built-in
  # dashboard as the thing exposed at ai.${DOMAIN_NAME}. It reads the agent's state
  # directly (shares the hermes-data volume) rather than being a separate agent
  # instance of its own.
  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    restart: unless-stopped
    depends_on:
      - hermes
    environment:
      HERMES_WEBUI_HOST: "0.0.0.0"
      HERMES_WEBUI_PORT: "8787"
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
      HERMES_API_URL: http://hermes:8642
      HERMES_WEBUI_GATEWAY_API_KEY: ${API_SERVER_KEY:?API_SERVER_KEY must be set in .env (any string, 16+ chars)}
      HERMES_WEBUI_PASSWORD: ${HERMES_WEBUI_PASSWORD:?HERMES_WEBUI_PASSWORD must be set in .env}
      # The image's own hermes user is uid/gid 10000 (confirmed against the actual
      # running hermes container -- NOT the 1000 upstream's own compose examples
      # default to), so files hermes-webui writes onto the shared hermes-data volume
      # stay readable/writable by the hermes service too.
      WANTED_UID: "10000"
      WANTED_GID: "10000"
    volumes:
      - hermes-data:/home/hermeswebui/.hermes
      - hermes-src:/home/hermeswebui/.hermes/hermes-agent:ro
      - hermes-webui-workspace:/workspace
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.ai.rule=Host(`ai.${DOMAIN_NAME}`)
      - traefik.http.routers.ai.entrypoints=websecure
      - traefik.http.routers.ai.tls=true
      - traefik.http.routers.ai.tls.certresolver=letsencrypt
      - traefik.http.services.ai.loadbalancer.server.port=8787
    logging: *logging

volumes:
  hermes-data:
  # Auto-populated from the hermes image's /opt/hermes the first time a container
  # mounts it (standard behavior for a fresh named volume over a non-empty image
  # path) -- NOT refreshed automatically after that. If the hermes image is ever
  # rebuilt with a materially different Hermes version, this volume needs a manual
  # `podman volume rm ai_hermes-src` (stack stopped first) to pick it up, or
  # hermes-webui's own Python env will drift from what the agent actually runs.
  hermes-src:
  hermes-webui-workspace:

networks:
  proxy:
    name: proxy
    external: true
