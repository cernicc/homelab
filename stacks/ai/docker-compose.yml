name: ai

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  hermes:
    build: .
    restart: unless-stopped
    # Playwright/Chromium needs more than the default 64m /dev/shm.
    shm_size: 1gb
    environment:
      TZ: Europe/Ljubljana
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:?OPENCODE_GO_API_KEY must be set in .env}
      # Optional: any model id from https://opencode.ai/zen/go/v1/models (default: glm-5.3)
      AI_MODEL: ${AI_MODEL:-}
      # OpenAI-compatible gateway API, loopback-only -- hermes-webui's Tasks/cron
      # health check talks to this (both run in this same container).
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "127.0.0.1"
      API_SERVER_KEY: ${API_SERVER_KEY:?API_SERVER_KEY must be set in .env (any string, 16+ chars)}
      # hermes-webui (https://github.com/nesquena/hermes-webui) login -- see
      # stacks/ai/README.md for why it's merged into this container/service
      # rather than run as its own.
      HERMES_WEBUI_PASSWORD: ${HERMES_WEBUI_PASSWORD:?HERMES_WEBUI_PASSWORD must be set in .env}
    volumes:
      - hermes-data:/opt/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.ai.rule=Host(`ai.${DOMAIN_NAME}`)
      - traefik.http.routers.ai.entrypoints=websecure
      - traefik.http.routers.ai.tls=true
      - traefik.http.routers.ai.tls.certresolver=letsencrypt
      - traefik.http.services.ai.loadbalancer.server.port=8787
    logging: *logging

volumes:
  hermes-data:

networks:
  proxy:
    name: proxy
    external: true
