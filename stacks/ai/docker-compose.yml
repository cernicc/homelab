name: ai

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-ts-sidecar: &ts-sidecar
  image: tailscale/tailscale:v1.104.4
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  logging: *logging

services:
  # Tailscale-sidecar ingress -- see stacks/whoami/README.md for the pattern.
  # `librechat` shares this container's network namespace entirely
  # (network_mode: service:librechat-ts), so it has no networking of its own
  # below. The sidecar joins the `ai` network so LibreChat can reach MongoDB
  # and Meilisearch by service name.
  librechat-ts:
    <<: *ts-sidecar
    hostname: chat
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set in ~/homelab/.env}
      - TS_HOSTNAME=chat
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_DEBUG_FIREWALL_MODE=nftables
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-config/librechat:/config:ro,Z
      - librechat-ts-state:/var/lib/tailscale
    networks:
      ai:
        aliases:
          - librechat

  # All configuration is declarative: this file (env vars) plus
  # librechat.yaml (endpoints, interface, MCP servers). Secrets come from
  # ~/homelab/.env.
  librechat:
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.8
    restart: unless-stopped
    network_mode: service:librechat-ts
    depends_on:
      - mongodb
      - meilisearch
      - agentgateway
    environment:
      # Loopback only: the sidecar's `tailscale serve` is the one way in, so
      # plain HTTP on :3080 isn't reachable on the container's tailnet IP.
      HOST: 127.0.0.1
      PORT: 3080
      DOMAIN_CLIENT: ${LIBRECHAT_DOMAIN:?set in ~/homelab/.env}
      DOMAIN_SERVER: ${LIBRECHAT_DOMAIN:?set in ~/homelab/.env}
      NO_INDEX: "true"
      TZ: Europe/Ljubljana
      CONFIG_PATH: /app/librechat.yaml
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      SEARCH: "true"
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${LIBRECHAT_MEILI_MASTER_KEY:?set in ~/homelab/.env}
      MEILI_NO_ANALYTICS: "true"
      # Encrypts stored credentials (e.g. MCP server tokens). Changing them
      # makes everything already stored unreadable.
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:?set in ~/homelab/.env}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:?set in ~/homelab/.env}
      # Sign session tokens. Changing them logs everyone out.
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:?set in ~/homelab/.env}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET:?set in ~/homelab/.env}
      # Accounts are created from the CLI (see README), never by sign-up.
      ALLOW_REGISTRATION: "false"
      ALLOW_SOCIAL_LOGIN: "false"
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_PASSWORD_RESET: "false"
      # LibreChat's key for agentgateway, which holds the OpenCode Go key
      # itself. Read by the endpoint in librechat.yaml.
      AGENTGATEWAY_LIBRECHAT_API_KEY: ${AGENTGATEWAY_LIBRECHAT_API_KEY:?set in ~/homelab/.env}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro,Z
      - librechat-data:/app/data
      - librechat-uploads:/app/uploads
      - librechat-images:/app/client/public/images
      - librechat-logs:/app/logs
    logging: *logging

  # LLM (and later MCP) gateway in front of OpenCode Go: holds the upstream
  # key, gives each client its own gateway key, logs requests, and serves a
  # web UI. Config in agentgateway.yaml. Unlike librechat, it has its own
  # network namespace on `ai` (LibreChat calls http://agentgateway:4000/v1),
  # so plain HTTP :4000 never reaches the tailnet; the sidecar below is the
  # one way in from there.
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.7.0
    restart: unless-stopped
    command: ["-f", "/config.yaml"]
    # The image's own user (65532) can't write agentgateway-data: a new volume
    # belongs to container root, which under rootless podman is the host user
    # rok. So run as container root, with every capability dropped. (Podman's
    # :U volume flag would chown it instead, but docker-compose drops it.)
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    environment:
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:?set in ~/homelab/.env}
      AGENTGATEWAY_LIBRECHAT_API_KEY: ${AGENTGATEWAY_LIBRECHAT_API_KEY:?set in ~/homelab/.env}
    networks:
      - ai
    volumes:
      - ./agentgateway.yaml:/config.yaml:ro,Z
      - agentgateway-data:/data
    logging: *logging

  # Tailnet ingress for the agentgateway UI and API at
  # https://agentgateway.<tailnet-name>.ts.net. Proxies to agentgateway over
  # the `ai` network rather than sharing its namespace (see above).
  # No `hostname:` here: podman registers it as a DNS alias on `ai`, and
  # `agentgateway` would then also resolve to this sidecar. TS_HOSTNAME alone
  # sets the tailnet name.
  agentgateway-ts:
    <<: *ts-sidecar
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set in ~/homelab/.env}
      - TS_HOSTNAME=agentgateway
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_DEBUG_FIREWALL_MODE=nftables
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-config/agentgateway:/config:ro,Z
      - agentgateway-ts-state:/var/lib/tailscale
    networks:
      - ai

  # Only on the `ai` network, never on the tailnet; --noauth is safe because
  # nothing but LibreChat can reach it.
  mongodb:
    image: mongo:8.0.20
    restart: unless-stopped
    command: mongod --noauth
    networks:
      - ai
    volumes:
      - mongodb-data:/data/db
    logging: *logging

  # Conversation search. Meilisearch can't open data written by another
  # minor version: before bumping the image, check its upgrade notes (or
  # drop the volume -- LibreChat re-indexes from MongoDB on start).
  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${LIBRECHAT_MEILI_MASTER_KEY:?set in ~/homelab/.env}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    networks:
      - ai
    volumes:
      - meilisearch-data:/meili_data
    logging: *logging

networks:
  ai:

volumes:
  librechat-ts-state:
  librechat-data:
  librechat-uploads:
  librechat-images:
  librechat-logs:
  mongodb-data:
  meilisearch-data:
  agentgateway-data:
  agentgateway-ts-state:
