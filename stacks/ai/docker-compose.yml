name: ai

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-ts-sidecar: &ts-sidecar
  image: tailscale/tailscale:v1.104.4
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  logging: *logging

services:
  # Tailscale-sidecar ingress -- see stacks/whoami/README.md for the pattern.
  # `librechat` shares this container's network namespace entirely
  # (network_mode: service:librechat-ts), so it has no networking of its own
  # below. The sidecar joins `librechat-db` so LibreChat can reach MongoDB
  # and Meilisearch, and `ai` so it can reach agentgateway.
  librechat-ts:
    <<: *ts-sidecar
    hostname: chat
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set in ~/homelab/.env}
      - TS_HOSTNAME=chat
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_DEBUG_FIREWALL_MODE=nftables
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-config/librechat:/config:ro,Z
      - librechat-ts-state:/var/lib/tailscale
    networks:
      ai:
        aliases:
          - librechat
      librechat-db:

  # All configuration is declarative: this file (env vars) plus
  # librechat.yaml (endpoints, interface, MCP servers). Secrets come from
  # ~/homelab/.env.
  librechat:
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.8
    restart: unless-stopped
    network_mode: service:librechat-ts
    depends_on:
      - mongodb
      - meilisearch
      - agentgateway
    environment:
      # Loopback only: the sidecar's `tailscale serve` is the one way in, so
      # plain HTTP on :3080 isn't reachable on the container's tailnet IP.
      HOST: 127.0.0.1
      PORT: 3080
      DOMAIN_CLIENT: ${LIBRECHAT_DOMAIN:?set in ~/homelab/.env}
      DOMAIN_SERVER: ${LIBRECHAT_DOMAIN:?set in ~/homelab/.env}
      NO_INDEX: "true"
      TZ: Europe/Ljubljana
      CONFIG_PATH: /app/librechat.yaml
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      SEARCH: "true"
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${LIBRECHAT_MEILI_MASTER_KEY:?set in ~/homelab/.env}
      MEILI_NO_ANALYTICS: "true"
      # Encrypts stored credentials (e.g. MCP server tokens). Changing them
      # makes everything already stored unreadable.
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:?set in ~/homelab/.env}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:?set in ~/homelab/.env}
      # Sign session tokens. Changing them logs everyone out.
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:?set in ~/homelab/.env}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET:?set in ~/homelab/.env}
      # Accounts are created from the CLI (see README), never by sign-up.
      ALLOW_REGISTRATION: "false"
      ALLOW_SOCIAL_LOGIN: "false"
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_PASSWORD_RESET: "false"
      # LibreChat's key for agentgateway, which holds the OpenCode Go key
      # itself. Read by the endpoint in librechat.yaml.
      AGENTGATEWAY_LIBRECHAT_API_KEY: ${AGENTGATEWAY_LIBRECHAT_API_KEY:?set in ~/homelab/.env}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro,Z
      - librechat-data:/app/data
      - librechat-uploads:/app/uploads
      - librechat-images:/app/client/public/images
      - librechat-logs:/app/logs
    logging: *logging

  # LLM (and later MCP) gateway in front of OpenCode Go: holds the upstream
  # key, gives each client its own gateway key, logs requests, and serves a
  # web UI. Config in agentgateway/config.yaml. Unlike librechat, it has its own
  # network namespace on `ai` (LibreChat calls http://agentgateway:4000/v1),
  # so plain HTTP :4000 never reaches the tailnet; the sidecar below is the
  # one way in from there.
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.7.0
    restart: unless-stopped
    command: ["-f", "/config/config.yaml"]
    # The image's own user (65532) can't write agentgateway-data: a new volume
    # belongs to container root, which under rootless podman is the host user
    # rok. So run as container root, with every capability dropped. (Podman's
    # :U volume flag would chown it instead, but docker-compose drops it.)
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    environment:
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:?set in ~/homelab/.env}
      AGENTGATEWAY_LIBRECHAT_API_KEY: ${AGENTGATEWAY_LIBRECHAT_API_KEY:?set in ~/homelab/.env}
      AGENTGATEWAY_SESSION_KEY: ${AGENTGATEWAY_SESSION_KEY:?set in ~/homelab/.env}
      AGENTGATEWAY_UNDERSTORY_API_KEY: ${AGENTGATEWAY_UNDERSTORY_API_KEY:?set in ~/homelab/.env}
      UNDERSTORY_AUTH_TOKEN: ${UNDERSTORY_AUTH_TOKEN:?set in ~/homelab/.env}
    networks:
      - ai
    volumes:
      # The directory, not the file: git replaces the file on pull, and a
      # single-file bind mount would keep showing the old one, so the
      # gateway's live reload would never see a change.
      - ./agentgateway:/config:ro,Z
      - agentgateway-data:/data
    logging: *logging

  # Tailnet ingress for the agentgateway UI and API at
  # https://agentgateway.<tailnet-name>.ts.net. Proxies to agentgateway over
  # the `ai` network rather than sharing its namespace (see above).
  # No `hostname:` here: podman registers it as a DNS alias on `ai`, and
  # `agentgateway` would then also resolve to this sidecar. TS_HOSTNAME alone
  # sets the tailnet name.
  agentgateway-ts:
    <<: *ts-sidecar
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set in ~/homelab/.env}
      - TS_HOSTNAME=agentgateway
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_DEBUG_FIREWALL_MODE=nftables
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-config/agentgateway:/config:ro,Z
      - agentgateway-ts-state:/var/lib/tailscale
    networks:
      - ai

  # understory: plain-markdown memory for agents, as an MCP server
  # (https://github.com/thecodacus/understory). Each tool call runs its own
  # LLM agent, which goes through agentgateway on its own key. Only on `ai`:
  # LibreChat reaches its tools through agentgateway's /mcp, never directly,
  # and its web UI is on the tailnet through understory-ts.
  # The image has no releases, only latest and per-commit sha tags.
  understory:
    image: ghcr.io/thecodacus/understory:sha-7625aa4
    restart: unless-stopped
    environment:
      BUNDLE_ROOT: /bundle
      # Required on /mcp and /api; agentgateway sends it.
      AUTH_TOKEN: ${UNDERSTORY_AUTH_TOKEN:?set in ~/homelab/.env}
      LLM_API_BASE_URL: http://agentgateway:4000/v1
      LLM_API_KEY: ${AGENTGATEWAY_UNDERSTORY_API_KEY:?set in ~/homelab/.env}
      LLM_API_FORMAT: openai
      # Must be one the gateway's understory key allows (agentgateway/config.yaml).
      LLM_MODEL: glm-5.3
      # Every memory change is a git commit in the bundle.
      GIT_AUTOCOMMIT: "true"
      TZ: Europe/Ljubljana
    depends_on:
      - agentgateway
    networks:
      - ai
    volumes:
      - understory-memory:/bundle
    logging: *logging

  # Tailnet ingress for understory's web UI (memory browser, graph, chat) at
  # https://understory.<tailnet-name>.ts.net. Proxies over `ai` like
  # agentgateway-ts, and has no `hostname:` for the same reason. The UI asks
  # for UNDERSTORY_AUTH_TOKEN before showing anything.
  understory-ts:
    <<: *ts-sidecar
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set in ~/homelab/.env}
      - TS_HOSTNAME=understory
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_DEBUG_FIREWALL_MODE=nftables
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-config/understory:/config:ro,Z
      - understory-ts-state:/var/lib/tailscale
    networks:
      - ai

  # Only on `librechat-db`, never on the tailnet or `ai`; --noauth is safe
  # because nothing but LibreChat can reach it.
  mongodb:
    image: mongo:8.0.20
    restart: unless-stopped
    command: mongod --noauth
    networks:
      - librechat-db
    volumes:
      - mongodb-data:/data/db
    logging: *logging

  # Conversation search. Meilisearch can't open data written by another
  # minor version: before bumping the image, check its upgrade notes (or
  # drop the volume -- LibreChat re-indexes from MongoDB on start).
  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${LIBRECHAT_MEILI_MASTER_KEY:?set in ~/homelab/.env}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    networks:
      - librechat-db
    volumes:
      - meilisearch-data:/meili_data
    logging: *logging

networks:
  # LibreChat, agentgateway, understory and their sidecars.
  ai:
  # LibreChat and its databases only, so nothing else in the stack can reach
  # the unauthenticated MongoDB.
  librechat-db:

volumes:
  librechat-ts-state:
  librechat-data:
  librechat-uploads:
  librechat-images:
  librechat-logs:
  mongodb-data:
  meilisearch-data:
  agentgateway-data:
  agentgateway-ts-state:
  understory-memory:
  understory-ts-state:
