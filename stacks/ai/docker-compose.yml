name: ai

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-ts-sidecar: &ts-sidecar
  image: tailscale/tailscale:v1.104.4
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  logging: *logging

services:
  # Tailscale-sidecar ingress -- see stacks/whoami/README.md for the pattern.
  # `librechat` shares this container's network namespace entirely
  # (network_mode: service:librechat-ts), so it has no networking of its own
  # below. The sidecar joins the `ai` network so LibreChat can reach MongoDB
  # and Meilisearch by service name.
  librechat-ts:
    <<: *ts-sidecar
    hostname: chat
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set in ~/homelab/.env}
      - TS_HOSTNAME=chat
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_DEBUG_FIREWALL_MODE=nftables
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-config/librechat:/config:ro,Z
      - librechat-ts-state:/var/lib/tailscale
    networks:
      ai:
        aliases:
          - librechat

  # All configuration is declarative: this file (env vars) plus
  # librechat.yaml (endpoints, interface, MCP servers). Secrets come from
  # ~/homelab/.env.
  librechat:
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.8
    restart: unless-stopped
    network_mode: service:librechat-ts
    depends_on:
      - mongodb
      - meilisearch
    environment:
      # Loopback only: the sidecar's `tailscale serve` is the one way in, so
      # plain HTTP on :3080 isn't reachable on the container's tailnet IP.
      HOST: 127.0.0.1
      PORT: 3080
      DOMAIN_CLIENT: ${LIBRECHAT_DOMAIN:?set in ~/homelab/.env}
      DOMAIN_SERVER: ${LIBRECHAT_DOMAIN:?set in ~/homelab/.env}
      NO_INDEX: "true"
      TZ: Europe/Ljubljana
      CONFIG_PATH: /app/librechat.yaml
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      SEARCH: "true"
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${LIBRECHAT_MEILI_MASTER_KEY:?set in ~/homelab/.env}
      MEILI_NO_ANALYTICS: "true"
      # Encrypts stored credentials (e.g. MCP server tokens). Changing them
      # makes everything already stored unreadable.
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:?set in ~/homelab/.env}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:?set in ~/homelab/.env}
      # Sign session tokens. Changing them logs everyone out.
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:?set in ~/homelab/.env}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET:?set in ~/homelab/.env}
      # Accounts are created from the CLI (see README), never by sign-up.
      ALLOW_REGISTRATION: "false"
      ALLOW_SOCIAL_LOGIN: "false"
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_PASSWORD_RESET: "false"
      # OpenCode Go subscription, declared as a custom endpoint in
      # librechat.yaml, which reads the key from here.
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:?set in ~/homelab/.env}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro,Z
      - librechat-data:/app/data
      - librechat-uploads:/app/uploads
      - librechat-images:/app/client/public/images
      - librechat-logs:/app/logs
    logging: *logging

  # Only on the `ai` network, never on the tailnet; --noauth is safe because
  # nothing but LibreChat can reach it.
  mongodb:
    image: mongo:8.0.20
    restart: unless-stopped
    command: mongod --noauth
    networks:
      - ai
    volumes:
      - mongodb-data:/data/db
    logging: *logging

  # Conversation search. Meilisearch can't open data written by another
  # minor version: before bumping the image, check its upgrade notes (or
  # drop the volume -- LibreChat re-indexes from MongoDB on start).
  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${LIBRECHAT_MEILI_MASTER_KEY:?set in ~/homelab/.env}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    networks:
      - ai
    volumes:
      - meilisearch-data:/meili_data
    logging: *logging

networks:
  ai:

volumes:
  librechat-ts-state:
  librechat-data:
  librechat-uploads:
  librechat-images:
  librechat-logs:
  mongodb-data:
  meilisearch-data:
