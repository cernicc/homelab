x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ghcr.io/piratuks/invoice-builder:latest
    container_name: invoice-builder
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      SERVICE: all
      NODE_ENV: docker
      DB_DIRECTORY: /data
      # Backend webserver port
      PORT: 3000
      # Backend webserver host
      DEV_SERVER_URL: 0.0.0.0
      # Frontend webserver URL
      FE_SERVER_URL: http://localhost:3001
      # Path to migration files in the image
      MIGRATIONS_PATH: /app/dist-be/backend/server/shared/migrations
      # nginx inside the container proxies /api/* to localhost (same container)
      BACKEND_HOST: localhost
      BACKEND_PORT: 3000
    volumes:
      - app-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('net');const c=net.createConnection(3000,'localhost');c.on('connect',()=>{c.destroy();process.exit(0)});c.on('error',()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.invoice-builder.rule=Host(`invoice-builder.${DOMAIN_NAME}`)
      - traefik.http.routers.invoice-builder.entrypoints=websecure
      - traefik.http.routers.invoice-builder.tls=true
      - traefik.http.routers.invoice-builder.tls.certresolver=letsencrypt
      - traefik.http.services.invoice-builder.loadbalancer.server.port=3001
    logging: *logging

volumes:
  app-data:

networks:
  proxy:
    name: proxy
    external: true
