name: media

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-media-env: &media-env
  PUID: 1000
  PGID: 1000
  TZ: Europe/Ljubljana

x-ts-sidecar: &ts-sidecar
  image: tailscale/tailscale:v1.102.4
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  logging: *logging

services:
  # Shared media tree, laid out per TRaSH Guides
  # (https://trash-guides.info/File-and-Folder-Structure/How-to-set-up/Docker/):
  #
  #   /data/torrents/{movies,tv}  qBittorrent downloads (category save paths)
  #   /data/media/{movies,tv}     Sonarr/Radarr library root folders
  #
  # Downloads and library live on one volume, mounted at the same /data path
  # in every container, so imports are hardlinks/atomic moves and no remote
  # path mappings are needed. Runs as root only to create the tree and chown
  # it to PUID/PGID, then exits; the app containers wait for it.
  data-init:
    image: busybox:1.37.0
    restart: "no"
    command: >-
      sh -c "mkdir -p /data/torrents/movies /data/torrents/tv
      /data/media/movies /data/media/tv
      && chown -R 1000:1000 /data"
    volumes:
      - data:/data
    logging: *logging

  # Tailscale-sidecar ingress -- see stacks/whoami/README.md for the pattern.
  # Each app container shares its sidecar's network namespace entirely
  # (network_mode: service:<sidecar>), so it has no networking of its own
  # below. Each sidecar also joins the `media` network under an alias equal
  # to the app's own service name, so inter-service calls (e.g. Bazarr ->
  # Sonarr, Seerr -> Radarr/Jellyfin) keep resolving the same hostnames they
  # did before.
  jellyfin-ts:
    <<: *ts-sidecar
    hostname: jellyfin
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=jellyfin
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-config/jellyfin:/config:ro,Z
      - jellyfin-ts-state:/var/lib/tailscale
    networks:
      media:
        aliases:
          - jellyfin

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.1ubu2604-ls50
    restart: unless-stopped
    network_mode: service:jellyfin-ts
    environment:
      <<: *media-env
    # GPU passthrough via CDI (see /run/cdi/nvidia.yaml, kept in sync by
    # nvidia-cdi-refresh.service). Docker's `deploy.resources.reservations`
    # GPU syntax is not translated to CDI over podman's Docker-compat socket;
    # this CDI-qualified device name is the form that actually works.
    devices:
      - nvidia.com/gpu=all
    depends_on:
      data-init:
        condition: service_completed_successfully
    volumes:
      - jellyfin-config:/config
      - data:/data:ro
    logging: *logging

  qbittorrent-ts:
    <<: *ts-sidecar
    hostname: qbittorrent
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=qbittorrent
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-config/qbittorrent:/config:ro,Z
      - qbittorrent-ts-state:/var/lib/tailscale
    ports:
      - 51413:51413 # torrent peer port
      - 51413:51413/udp
    networks:
      media:
        aliases:
          - qbittorrent

  # No credentials via env: on first start the image logs a temporary admin
  # password (`podman logs media-qbittorrent-1`); set a permanent one in the
  # web UI. Also set there: default save path /data/torrents, and categories
  # `movies` -> /data/torrents/movies, `tv` -> /data/torrents/tv (matching the
  # categories in Radarr/Sonarr's download client settings).
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    restart: unless-stopped
    network_mode: service:qbittorrent-ts
    environment:
      <<: *media-env
      WEBUI_PORT: 8080
      TORRENTING_PORT: 51413
    depends_on:
      data-init:
        condition: service_completed_successfully
    volumes:
      - qbittorrent-config:/config
      - data:/data
    logging: *logging

  prowlarr-ts:
    <<: *ts-sidecar
    hostname: prowlarr
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=prowlarr
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-config/prowlarr:/config:ro,Z
      - prowlarr-ts-state:/var/lib/tailscale
    networks:
      media:
        aliases:
          - prowlarr

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    restart: unless-stopped
    network_mode: service:prowlarr-ts
    environment:
      <<: *media-env
    volumes:
      - prowlarr-config:/config
    logging: *logging

  # Cloudflare challenge solver for Prowlarr indexers. No UI and nothing
  # else talks to it, so no Tailscale sidecar: it only sits on the `media`
  # network. In Prowlarr add it under Settings -> Indexers as a FlareSolverr
  # proxy with host http://flaresolverr:8191/ and a tag, then put that tag
  # on the indexers that need it.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    restart: unless-stopped
    environment:
      TZ: Europe/Ljubljana
      LOG_LEVEL: info
    networks:
      - media
    logging: *logging

  sonarr-ts:
    <<: *ts-sidecar
    hostname: sonarr
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=sonarr
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-config/sonarr:/config:ro,Z
      - sonarr-ts-state:/var/lib/tailscale
    networks:
      media:
        aliases:
          - sonarr

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    restart: unless-stopped
    network_mode: service:sonarr-ts
    environment:
      <<: *media-env
    depends_on:
      data-init:
        condition: service_completed_successfully
    volumes:
      - sonarr-config:/config
      - data:/data
    logging: *logging

  radarr-ts:
    <<: *ts-sidecar
    hostname: radarr
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=radarr
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-config/radarr:/config:ro,Z
      - radarr-ts-state:/var/lib/tailscale
    networks:
      media:
        aliases:
          - radarr

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    restart: unless-stopped
    network_mode: service:radarr-ts
    environment:
      <<: *media-env
    depends_on:
      data-init:
        condition: service_completed_successfully
    volumes:
      - radarr-config:/config
      - data:/data
    logging: *logging

  seerr-ts:
    <<: *ts-sidecar
    hostname: seerr
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=seerr
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-config/seerr:/config:ro,Z
      - seerr-ts-state:/var/lib/tailscale
    networks:
      media:
        aliases:
          - seerr

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    init: true
    restart: unless-stopped
    network_mode: service:seerr-ts
    environment:
      TZ: Europe/Ljubljana
    volumes:
      - seerr-config:/app/config
    logging: *logging

  bazarr-ts:
    <<: *ts-sidecar
    hostname: bazarr
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=bazarr
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-config/bazarr:/config:ro,Z
      - bazarr-ts-state:/var/lib/tailscale
    networks:
      media:
        aliases:
          - bazarr

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.1
    restart: unless-stopped
    network_mode: service:bazarr-ts
    environment:
      <<: *media-env
    depends_on:
      data-init:
        condition: service_completed_successfully
    volumes:
      - bazarr-config:/config
      - data:/data
    logging: *logging

volumes:
  data:
  qbittorrent-config:
  sonarr-config:
  radarr-config:
  prowlarr-config:
  jellyfin-config:
  seerr-config:
  bazarr-config:
  jellyfin-ts-state:
  qbittorrent-ts-state:
  prowlarr-ts-state:
  sonarr-ts-state:
  radarr-ts-state:
  seerr-ts-state:
  bazarr-ts-state:

networks:
  media:
    driver: bridge
