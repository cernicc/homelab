name: media

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-media-env: &media-env
  PUID: 1000
  PGID: 1000
  TZ: Europe/Ljubljana

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11
    restart: unless-stopped
    environment:
      <<: *media-env
    volumes:
      - jellyfin-config:/config
      - downloads:/data/downloads:ro
    networks:
      - media
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN_NAME}`)
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.service=jellyfin
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.routers.jellyfin.tls.certresolver=letsencrypt
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
    logging: *logging

  transmission:
    image: linuxserver/transmission:4.0.6
    restart: unless-stopped
    environment:
      <<: *media-env
      USER: ${TRANSMISSION_USER}
      PASS: ${TRANSMISSION_PASS}
    volumes:
      - tx-config:/config
      - tx-watch:/watch
      - downloads:/downloads
    ports:
      - 51413:51413 # torrent peer port
    networks:
      - media
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.transmission.rule=Host(`transmission.${DOMAIN_NAME}`)
      - traefik.http.routers.transmission.entrypoints=websecure
      - traefik.http.routers.transmission.service=transmission
      - traefik.http.routers.transmission.tls=true
      - traefik.http.routers.transmission.tls.certresolver=letsencrypt
      - traefik.http.services.transmission.loadbalancer.server.port=9091
    logging: *logging

  prowlarr:
    image: linuxserver/prowlarr:2.3.0
    restart: unless-stopped
    environment:
      <<: *media-env
    volumes:
      - prowlarr-config:/config
    networks:
      - media
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN_NAME}`)
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.routers.prowlarr.service=prowlarr
      - traefik.http.routers.prowlarr.tls=true
      - traefik.http.routers.prowlarr.tls.certresolver=letsencrypt
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
    logging: *logging

  sonarr:
    image: linuxserver/sonarr:4.0.19
    restart: unless-stopped
    environment:
      <<: *media-env
    volumes:
      - sonarr-config:/config
      - downloads:/downloads
    networks:
      - media
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN_NAME}`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.service=sonarr
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.routers.sonarr.tls.certresolver=letsencrypt
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    logging: *logging

  radarr:
    image: lscr.io/linuxserver/radarr:6.0.4
    restart: unless-stopped
    environment:
      <<: *media-env
    volumes:
      - radarr-config:/config
      - downloads:/downloads
    networks:
      - media
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN_NAME}`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.service=radarr
      - traefik.http.routers.radarr.tls=true
      - traefik.http.routers.radarr.tls.certresolver=letsencrypt
      - traefik.http.services.radarr.loadbalancer.server.port=7878
    logging: *logging

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.0.1
    init: true
    restart: unless-stopped
    environment:
      TZ: Europe/Ljubljana
    volumes:
      - seerr-config:/app/config
    networks:
      - media
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.seerr.rule=Host(`seerr.${DOMAIN_NAME}`)
      - traefik.http.routers.seerr.entrypoints=websecure
      - traefik.http.routers.seerr.service=seerr
      - traefik.http.routers.seerr.tls=true
      - traefik.http.routers.seerr.tls.certresolver=letsencrypt
      - traefik.http.services.seerr.loadbalancer.server.port=5055
    logging: *logging

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    restart: unless-stopped
    environment:
      <<: *media-env
    volumes:
      - bazarr-config:/config
      - downloads:/data/downloads
    networks:
      - media
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN_NAME}`)
      - traefik.http.routers.bazarr.entrypoints=websecure
      - traefik.http.routers.bazarr.service=bazarr
      - traefik.http.routers.bazarr.tls=true
      - traefik.http.routers.bazarr.tls.certresolver=letsencrypt
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
    logging: *logging

volumes:
  downloads:
  tx-config:
  tx-watch:
  sonarr-config:
  radarr-config:
  prowlarr-config:
  jellyfin-config:
  seerr-config:
  bazarr-config:

networks:
  media:
    internal: true
  proxy:
    external: true
