name: media

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-media-env: &media-env
  PUID: 1000
  PGID: 1000
  TZ: Europe/Ljubljana

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11
    restart: unless-stopped
    environment:
      <<: *media-env
    volumes:
      - jellyfin-config:/config
      - downloads:/data/downloads:ro
    networks:
      - media
    logging: *logging

  transmission:
    image: lscr.io/linuxserver/transmission:4.1.3
    restart: unless-stopped
    environment:
      <<: *media-env
      USER: ${TRANSMISSION_USER}
      PASS: ${TRANSMISSION_PASS}
    volumes:
      - tx-config:/config
      - tx-watch:/watch
      - downloads:/downloads
    ports:
      - 51413:51413 # torrent peer port
    networks:
      - media
    logging: *logging

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    restart: unless-stopped
    environment:
      <<: *media-env
    volumes:
      - prowlarr-config:/config
    networks:
      - media
    logging: *logging

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    restart: unless-stopped
    environment:
      <<: *media-env
    volumes:
      - sonarr-config:/config
      - downloads:/downloads
    networks:
      - media
    logging: *logging

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0
    restart: unless-stopped
    environment:
      <<: *media-env
    volumes:
      - radarr-config:/config
      - downloads:/downloads
    networks:
      - media
    logging: *logging

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.1.0
    init: true
    restart: unless-stopped
    environment:
      TZ: Europe/Ljubljana
    volumes:
      - seerr-config:/app/config
    networks:
      - media
    logging: *logging

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    restart: unless-stopped
    environment:
      <<: *media-env
    volumes:
      - bazarr-config:/config
      - downloads:/data/downloads
    networks:
      - media
    logging: *logging

volumes:
  downloads:
  tx-config:
  tx-watch:
  sonarr-config:
  radarr-config:
  prowlarr-config:
  jellyfin-config:
  seerr-config:
  bazarr-config:

networks:
  media:
    driver: bridge
