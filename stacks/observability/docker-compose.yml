x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
    networks:
      - observability
    logging: *logging

  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro,Z
      - loki_data:/loki
    networks:
      - observability
    logging: *logging

  alloy:
    image: grafana/alloy:v1.21.1
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    # Talks to podman only through socket-proxy below, never the socket itself.
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro,Z
    networks:
      - observability
      - socket-proxy
    depends_on:
      - socket-proxy
    logging: *logging

  # Read-only gate in front of the podman socket for Alloy. Full socket access
  # is equivalent to running code as the host user (start a container mounting
  # $HOME, exec into any container), so Alloy gets only the GET calls log
  # collection needs: list/inspect containers, their logs, events, and the
  # network list (discovery labels targets by network). Everything else -- including
  # GET .../archive and .../export, which would read files out of any
  # container -- is rejected, and only the `alloy` host may connect.
  #
  # The socket is labelled user_tmp_t and can't be relabelled with :Z, so
  # SELinux confinement is disabled here (and only here) to let it connect.
  # Runs as container root because under rootless podman that maps to the
  # host user who owns the socket; it still drops all capabilities.
  socket-proxy:
    image: docker.io/wollomatic/socket-proxy:1.13.1
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - label=disable
      - no-new-privileges
    mem_limit: 64M
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=alloy
      - -allowGET=(/v1\.[0-9]+)?/(_ping|version|events|networks|containers/json|containers/[a-zA-Z0-9_.-]+/(json|logs))
      - -allowHEAD=(/v1\.[0-9]+)?/_ping
      - -allowhealthcheck
      - -watchdoginterval=3600
      - -stoponwatchdog
      - -shutdowngracetime=5
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 2
    volumes:
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
    logging: *logging

volumes:
  grafana_data:
  loki_data:

networks:
  observability:
    driver: bridge
  # Only Alloy and the proxy; no route out.
  socket-proxy:
    driver: bridge
    internal: true
