---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: ucore-server
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/ucore-minimal
image-version: stable-nvidia # latest is also supported if you want new updates ASAP

modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - ganto/lxc4
    install:
      packages:
        - incus
        - chezmoi

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: systemd
    system:
      enabled:
        - sshd.service
        - tailscaled.service
        - incus.service
        - bootc-fetch-apply-updates.timer
        - homelab-firewall.service
        - homelab-bootstrap.service

  - type: script
    snippets:
      - ln -sf /usr/share/zoneinfo/Europe/Ljubljana /etc/localtime
